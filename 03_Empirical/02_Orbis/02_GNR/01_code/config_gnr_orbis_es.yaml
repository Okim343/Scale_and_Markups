# =============================================================================
# Per-cell GNR for the Orbis Spain panel (01_Cleaning/01_code/02_clean_orbis_es.py).
# One production function per NAICS2 cell (`ind2d`), as Hubmer et al. (2025).
# Estimator: the shared 03_Empirical/00_GNR_core. Trimming, step 1 and step 2
# settings are identical to the Compustat config
# (01_Compustat/00_Hubmer_RTS/01_code/config.yaml), but every trim (share band,
# percentile cut, minimum year size) is applied within the cell.
#
#   python 01_run_gnr_cell.py --cell 21          # one cell
#   python 03_seed_check_cell.py --cell 21       # step 2 under other Sobol seeds
#   python 02_combine_cells.py                   # stack cells; final 03_outdata/ when complete
#   sbatch 01_code/run_all_cells.slurm           # all of the above on the lab workstation
#
# Outputs are firm-level WRDS derivatives: they stay under the gitignored
# 01_intermediary/ and are never published to the Compustat alpha pipeline.
# All relative paths resolve against the project root.
# =============================================================================

pipeline_version: "0.2.0-orbis-es-cells"

# --- Input -------------------------------------------------------------------
input:
  # Baseline tfas capital; gnr_ready_fias.parquet for the Hubmer et al. capital.
  source: "03_Empirical/02_Orbis/01_Cleaning/01_intermediary/gnr_ready_tfas.parquet"

# --- Variable mapping (columns of the input -> GNR levels) --------------------
mapping:
  id: bvdid            # firm identifier
  year: year
  ind: ind2d           # NAICS2 cell, 31-33 / 44-45 / 48-49 grouped (coded 31 / 44 / 48)
  revenue: rev_D       # turn, else opre; HICP-deflated, 2019 EUR
  capital: cap_D       # tfas (fias in gnr_ready_fias); HICP-deflated
  materials: mate_D    # material costs; same deflator as revenue, so s is nominal
  labor: staf_D        # wage bill, as Hubmer et al. App. C.3
  wage_bill: wagebill_D # copy of staf_D; w = log(staf/staf) = 0, unused (require_wages: false)

# --- Panel construction -------------------------------------------------------
panel:
  start_year: 2014           # 2014 is lag-only: it has no 2013 lag, so it never enters estimation
  end_year: 2023             # 2024 is robustness only (selectively incomplete)
  require_wages: false       # baseline GNR does NOT require wages for identification
  build_materials_alt1: false # cogs - xlr robustness is Compustat-specific (mate excludes staf)
  min_final_rows: 2000       # per-cell guardrail after trimming (smallest cell, 21, has ~7.5k)

# --- Cells ------------------------------------------------------------------------
cells:
  # Retained ind2d cells of the cleaned panel (exclusions applied in cleaning).
  list: [11, 21, 22, 23, 31, 42, 44, 48, 51, 54, 56, 61, 71, 72]

# --- Trimming (mirrors est_gnr.m) ---------------------------------------------
trimming:
  # "matlab": est_gnr.m's joint trimsel on the complete-case sample (percentile cuts on
  # r, k, l, m only, MATLAB prctile, pre-trim industry/year counts); "extended": the
  # Compustat pipeline's sequential trimming. See 00_GNR_core/gnr_panel.py.
  mode: matlab
  # exp(s) = materials share of revenue must lie in this band (MATLAB sselectortwo).
  share_bounds: [0.05, 0.95]
  # Percentile trim on r, k, l, m (MATLAB mincut/maxcut; 1/100 trims the
  # bottom 1% of each variable and nothing at the top).
  pctile_mincut: 1
  pctile_maxcut: 100
  # Minimum observations per industry / per year in the trimmed sample.
  ind_min_obs: 500
  year_min_obs: 500

# --- Step 1: NLS share regression (materials elasticity) -----------------------
step1:
  # Search "matlab": est_gnr.m's start set (OLS guess, gamma0, 2*gamma0, Sobol points),
  # L-BFGS-B local solves, fminsearch-like polish. See 00_GNR_core/README.md.
  search: matlab
  seed: 2020
  n_workers: 10        # parallel multistart processes (1 = serial)
  n_sobol: 6000        # Sobol pool size (MATLAB: gensobol(6000, ...))
  n_starts: 100        # starting points drawn from the pool (before feasibility filter)
  # Sobol box per parameter block (matches MATLAB):
  #   intercept in [-2, 2]; 6 mid terms in [-0.5, 0.5]; last 3 in [-0.1, 0.1]
  sobol_bounds:
    intercept: [-2.0, 2.0]
    mid: [-0.5, 0.5]
    tail: [-0.1, 0.1]
  maxiter_local: 2000   # per-start L-BFGS-B iterations
  maxfev_polish: 10000  # Nelder-Mead polish budget (MATLAB fminsearch MaxFunEvals)

# --- Step 2: nested GMM (integration constant + productivity Markov process) ---
step2:
  # "exact": est_gnr.m's moments and start set (OLS guess, alpha0, n_starts Sobol points),
  # solved as roots of the moment equations (standardized k / l, Levenberg-Marquardt, exact
  # Jacobian); every endpoint is checked and the number of exact / distinct roots reported.
  # est_gnr.m's own fminunc search stalls at non-stationary points on Orbis cells.
  search: exact
  # Root selection under search: exact (fixed in advance; alternatives are reported as
  # robustness). Distinct roots are grouped (single linkage) when their step-2-sample mean
  # RTS, labor and capital elasticities differ by less than group_tol; the group reached
  # from most starts wins, represented by its member reached most often. Absent: the
  # distinct root reached from most starts.
  root_selection:
    rule: most_starts_grouped
    group_tol: {rts: 0.01, lelast: 0.01, kelast: 0.005}
  seed: 1982
  n_workers: 10
  n_sobol: 500
  n_starts: 100
  sobol_bounds: [-1.0, 1.0]
  h2size: 4             # cubic Markov process (MATLAB h2size = 4)

# --- Post-processing ------------------------------------------------------------
postprocess:
  # Diagnostics-only band: RTS outside this range is flagged (not dropped).
  rts_flag_range: [0.0, 3.0]

# --- Combine ------------------------------------------------------------------------
combine:
  window: [2015, 2023]       # window for the per-cell summary table

# --- Output locations ------------------------------------------------------------
output:
  intermediary_dir: "03_Empirical/02_Orbis/02_GNR/01_intermediary"   # cells/<ind2d>/, combined files
  # Final estimates for downstream use (F^alpha, markups): firm_year_rts.parquet + manifest.yaml.
  # Written by 02_combine_cells.py only when all cells ran with this config. Gitignored.
  outdata_dir: "03_Empirical/02_Orbis/02_GNR/03_outdata"

# --- Logging ----------------------------------------------------------------------
log_level: INFO
