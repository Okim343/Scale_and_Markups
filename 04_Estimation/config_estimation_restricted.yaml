# Restricted-heterogeneity recalibrations (04_Estimation/03_calibrate_restricted.py).
# Each restricted economy minimizes the baseline Zipf objective over its own free
# parameters (orbis_estimation.restricted.ECONOMIES), on the targets it can reach
# (`targets`, default all four); the other baseline targets are reported as misses:
#   hom_alpha  (nu only)     xi, N, gamma -> all four (RTS gap is 0 by construction);
#                            alpha = harmonic mean of F^alpha below the cap; rho_bar 0
#   hom_v      (alpha only)  gamma -> mu_cw; xi = inf (v = v_min); N at the baseline; rho_bar 0
#   hom_both                 gamma -> mu_cw; both common; N at the baseline
# hom_v and hom_both cannot reach the Zipf indices (zeta_top5 >= 6.9 over the whole
# hom_v (N, gamma) scan; flat at 66 for hom_both) or the RTS gap, and N has no
# reachable target, so it stays at the baseline value.
# Everything the baseline fit uses (bundle, Zipf targets, simulation config, M, seed, eta,
# weights, bounds, trf settings) is read from zipf_config, so the footing is the baseline's.
# Relative paths resolve against this file's folder.

paths:
  zipf_config: config_estimation_zipf.yaml
  baseline_params: out_results/zipf/job3162/calibrated_params_zipf.yaml   # workstation job 3162
  out_results_dir: out_results/zipf/restricted   # gitignored; one subfolder per economy

baseline_params_sha256: 76e893fe4d6ddd197ba4c4221522c5032d7ace5a9311e6996287ad11db5a8f00

log_level: INFO

# Initial values default to the baseline calibration; `initial` overrides them and
# --initial-from-scan replaces them with the lowest-cost scan point.
# Scans (--scan) evaluate the objective on a grid at scan_M; free parameters without
# an axis stay at their initial values.
scan_M: 1000

economies:
  hom_alpha:
    scan:              # gamma held at its initial value
      xi: [3.0, 4.5, 6.0, 8.0, 10.5, 14.0]
      N: [100.0, 200.0, 350.0, 600.0, 1000.0, 1600.0]
  hom_v:
    targets: [mu_cw]
    initial:
      gamma: 6.6       # (N, gamma) scan at M=1000: mu_cw crosses 1.1815 between gamma 6 and 7 at N 400-800
    scan:              # the (N, gamma) scan of workstation job 3431 ran with N free
      gamma: [5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0]
  hom_both:
    targets: [mu_cw]
    initial:
      gamma: 6.56      # symmetric Cournot with s = 1/N at the baseline N gives mu_cw = 1.1815
    scan:
      gamma: [5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0]

resilience:            # per-evaluation watchdog (orbis_estimation.restricted.Watchdog)
  timeout_factor: 4.0  # limit = max(timeout_min_s, factor * median completed evaluation)
  timeout_min_s: 900
  timeout_first_s: 5400   # before three evaluations have completed, and for the final solve
